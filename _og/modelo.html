<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #F5F3EE; color: #0F1E33; font-family: 'Public Sans', sans-serif; display: flex; }
  .ico { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .ico [data-solido] { fill: currentColor; stroke: none; }
  .texto { width: 800px; height: 630px; padding: 64px 56px 60px 72px; display: flex; flex-direction: column; }
  .marca { display: flex; align-items: center; gap: 14px; }
  .marca img { width: 48px; height: 48px; }
  .marca span { font: 800 32px 'Bricolage Grotesque', sans-serif; letter-spacing: -0.02em; }
  .meio { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .rotulo { font: 500 21px 'JetBrains Mono', monospace; color: #0B5F91; text-transform: uppercase; letter-spacing: 0.02em; }
  h1 { font: 800 var(--tam, 76px)/1.02 'Bricolage Grotesque', sans-serif; letter-spacing: -0.035em; }
  h1 .ponto { color: #7FB539; }
  .lead { font-size: 26px; line-height: 1.42; color: #3C4A5E; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .rodape { display: flex; align-items: center; gap: 16px; font-size: 21px; color: #3C4A5E; }
  .rodape .url { font: 500 20px 'JetBrains Mono', monospace; color: #0F1E33; }
  .rodape i { width: 6px; height: 6px; border-radius: 50%; background: #7FB539; }
  .lado { flex: 1; height: 630px; background: #E6EEF3; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .lado .fundo { position: absolute; right: -70px; bottom: -70px; width: 330px; height: 330px; color: #0F1E33; opacity: 0.05; }
  .lado .fundo .ico { width: 100%; height: 100%; stroke-width: 1.1; }
  .tile { position: relative; width: 250px; height: 250px; border-radius: 40px; background: #fff; border: 2px solid #D5DEE5; display: flex; align-items: center; justify-content: center; color: #0B5F91; box-shadow: 0 30px 60px -30px rgba(15, 30, 51, 0.35); }
  .tile .ico { width: 136px; height: 136px; }
  .grade { display: grid; grid-template-columns: repeat(3, 104px); gap: 18px; }
  .grade div { width: 104px; height: 104px; border-radius: 22px; background: #fff; border: 2px solid #D5DEE5; display: flex; align-items: center; justify-content: center; color: #0B5F91; }
  .grade .ico { width: 52px; height: 52px; stroke-width: 1.75; }
</style>
</head>
<body>
<div class="texto">
  <div class="marca"><img src="{{LOGO}}" alt=""><span>SEI Pro</span></div>
  <div class="meio">
    {{ROTULO}}
    <h1 style="--tam: {{TAMANHO}}px">{{TITULO}}</h1>
    <p class="lead">{{LEAD}}</p>
  </div>
  <div class="rodape"><span class="url">sei-pro.github.io/sei-pro</span><i></i><span>Extensão gratuita para o SEI 4 e 5</span></div>
</div>
<div class="lado">{{LADO}}</div>
</body>
</html>
